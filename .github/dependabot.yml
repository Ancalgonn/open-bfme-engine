version: 2
updates:
  - package-ecosystem: npm
    directory: /tools/bfme-launcher-mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      launcher-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
