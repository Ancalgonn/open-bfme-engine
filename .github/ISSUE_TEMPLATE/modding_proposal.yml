name: Modding proposal
description: Propose a modding workflow, data contract, or contributor project.
title: "[Modding]: "
labels: [modding, proposal]
body:
  - type: markdown
    attributes:
      value: Read `docs/MODDING.md` first. Proposals must not require distributing retail or converted retail content.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should a modder be able to create or change?
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Proposed public contract
      description: Describe the data, tools, or interfaces involved and how the retail-content boundary remains intact.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Example and acceptance check
      description: Use project-authored or synthetic examples only.
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Content boundary
      options:
        - label: This proposal does not distribute retail assets or private converted packs.
          required: true
