name: Public CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publication-boundary:
    name: Publication boundary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test export scanner
        shell: powershell
        run: ./tools/test-export-scan.ps1
      - name: Scan public game tree
        shell: powershell
        run: ./tools/export-scan.ps1 -Root game

  launcher-protocol:
    name: Launcher protocol
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/bfme-launcher-mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/bfme-launcher-mcp/package-lock.json
      - run: npm.cmd ci
      - name: Test environment-independent protocol handshake
        run: node --test test/raw-protocol.test.mjs
